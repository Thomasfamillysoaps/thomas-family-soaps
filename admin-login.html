<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Thomas Family Soaps</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="header-placeholder"></div>
    <header class="store-header">
        <img src="tfs logo.png" alt="Thomas Family Soaps Logo" class="logo">
        <h1>Admin Login</h1>
    </header>
    <main class="admin-page">
        <section class="admin-card">
            <h2>Owner Access Only</h2>
            <p class="admin-subtext">Log in to manage orders and inventory.</p>

            <form id="admin-login-form" class="admin-login-form">
                <label for="admin-username">Username</label>
                <input type="text" id="admin-username" name="username" required>

                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" name="password" required>

                <button type="submit" class="save-btn">Log In</button>
            </form>

            <p id="login-message" class="admin-status-message"></p>
        </section>
    </main>

    <script src="cart.js?v=4"></script>
    <script src="admin-login.js?v=2"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            updateCartCount();
        });
    </script>
<script src="cart.js?v=2"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    fetch("header.html")
        .then(response => response.text())
        .then(data => {
            const placeholder = document.getElementById("header-placeholder");
            if (!placeholder) return;

            placeholder.innerHTML = data;

            const menuBtn = document.getElementById("menu-btn");
            const dropdownMenu = document.getElementById("dropdown-menu");

            if (menuBtn && dropdownMenu) {
                menuBtn.addEventListener("click", function (event) {
                    event.stopPropagation();
                    dropdownMenu.classList.toggle("show");
                });

                document.addEventListener("click", function (event) {
                    if (!menuBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                        dropdownMenu.classList.remove("show");
                    }
                });
            }

            if (typeof updateCartCount === "function") {
                updateCartCount();
            }
        })
        .catch(error => {
            console.error("HEADER LOAD ERROR:", error);
        });
});
</script>
</body>
</html>
