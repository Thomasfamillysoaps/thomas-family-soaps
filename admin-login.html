<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Thomas Family Soaps</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <header class="store-header">
        <img src="tfs logo.png" alt="Thomas Family Soaps Logo" class="logo">
        <h1>Admin Login</h1>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="shop.html">Shop Our Soaps</a>
            <a href="contact.html">Contact Us</a>
            <a href="cart.html" id="cart-link">🛒 View Your Cart (0)</a>
        </nav>
    </header>

    <main class="admin-page">
        <section class="admin-card">
            <h2>Owner Access Only</h2>
            <p class="admin-subtext">Log in to manage orders and inventory.</p>

            <form id="admin-login-form" class="admin-login-form">
                <label for="admin-username">Username</label>
                <input type="text" id="admin-username" name="username" required>

                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" name="password" required>

                <button type="submit" class="save-btn">Log In</button>
            </form>

            <p id="login-message" class="admin-status-message"></p>
        </section>
    </main>

    <script src="cart.js?v=3"></script>
    <script src="admin-login.js?v=2"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            updateCartCount();
        });
    </script>

</body>
</html>
