<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Order | Thomas Family Soaps</title>
    <link rel="stylesheet" href="orders.css">
</head>
<body>
<div id="header-placeholder"></div>
    <header class="store-header">
        <img src="tfs logo.png" alt="Thomas Family Soaps Logo" class="logo">
        <h1>Find My Order</h1>

    </header>

    <main class="orders-page">
        <section class="lookup-card">
            <h2>Look Up Your Order</h2>
            <p class="lookup-intro">
                Enter your full order number below to view your order details.
            </p>

            <div class="lookup-form">
                <input type="text" id="order-number" placeholder="Order Number" required>
                <input type="email" id="order-email" placeholder="Email Used at Checkout" required>
                <button type="button" id="find-order-btn" class="lookup-btn">
                    Find My Order
                </button>
            </div>

            <div id="order-lookup-message" class="lookup-message"></div>
            <div id="order-results" class="order-results"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Thomas Family Soaps. All rights reserved.</p>
            <p class="footer-links">
                <a href="legal.html#privacy-policy">Privacy Policy</a> |
                <a href="legal.html#terms-conditions">Terms &amp; Conditions</a> |
                <a href="legal.html#refund-policy">Refund Policy</a> |
                <a href="legal.html#shipping-policy">Shipping Policy</a>
            </p>
        </div>
    </footer>

    <script src="cart.js?v=4"></script>
    <script src="cart.js?v=2"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    fetch("header.html")
        .then(response => response.text())
        .then(data => {
            const placeholder = document.getElementById("header-placeholder");
            if (!placeholder) return;

            placeholder.innerHTML = data;

            const menuBtn = document.getElementById("menu-btn");
            const dropdownMenu = document.getElementById("dropdown-menu");

            if (menuBtn && dropdownMenu) {
                menuBtn.addEventListener("click", function (event) {
                    event.stopPropagation();
                    dropdownMenu.classList.toggle("show");
                });

                document.addEventListener("click", function (event) {
                    if (!menuBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                        dropdownMenu.classList.remove("show");
                    }
                });
            }

            if (typeof updateCartCount === "function") {
                updateCartCount();
            }
        })
        .catch(error => {
            console.error("HEADER LOAD ERROR:", error);
        });
});
</script>
</body>
</html>
