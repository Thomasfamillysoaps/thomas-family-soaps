<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Thomas Family Soaps</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <header class="store-header">
        <img src="tfs logo.png" alt="Thomas Family Soaps Logo" class="logo">
        <h1>Thomas Family Soaps Admin</h1>
    </header>
    <main class="admin-page">
        <section class="admin-intro card">
            <h2>Admin Dashboard</h2>
            <button class="action-btn" type="button" onclick="logout()">Logout</button>
            <p>
                This page lets you manage inventory and view customer orders.
            </p>
            <p id="admin-status-message" class="admin-status-message">
                Loading admin data...
            </p>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Inventory</h2>
                <button id="refresh-stock-btn" class="action-btn" type="button">Refresh Stock</button>
            </div>
            <div id="inventory-list" class="inventory-list"></div>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>Orders</h2>
                <button id="refresh-orders-btn" class="action-btn" type="button">Refresh Orders</button>
            </div>
            <div id="orders-list" class="orders-list"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Thomas Family Soaps. All rights reserved.</p>
    </footer>
    
    <script src="cart.js?v=2"></script>
    <script src="admin.js?v=3"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    fetch("header.html")
        .then(response => response.text())
        .then(data => {
            const placeholder = document.getElementById("header-placeholder");
            if (!placeholder) return;

            placeholder.innerHTML = data;

            const menuBtn = document.getElementById("menu-btn");
            const dropdownMenu = document.getElementById("dropdown-menu");

            if (menuBtn && dropdownMenu) {
                menuBtn.addEventListener("click", function (event) {
                    event.stopPropagation();
                    dropdownMenu.classList.toggle("show");
                });

                document.addEventListener("click", function (event) {
                    if (!menuBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                        dropdownMenu.classList.remove("show");
                    }
                });
            }

            if (typeof updateCartCount === "function") {
                updateCartCount();
            }
        })
        .catch(error => {
            console.error("HEADER LOAD ERROR:", error);
        });
});
</script>
</body>
</html>
